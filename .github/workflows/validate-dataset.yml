name: Validate Dataset & API Test Suite

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-validate:
    name: Test API & Validate Dataset Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check canonical preview exports
        run: npm run check:canonical

      - name: Run API Contract & Regression Tests
        run: npm run test:api

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run dataset validation suite
        run: python validate_dataset.py
