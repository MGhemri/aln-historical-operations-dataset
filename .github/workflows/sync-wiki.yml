name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          WIKI_REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          
          # Clone or init wiki repo
          if git clone "$WIKI_REPO" wiki_repo 2>/dev/null; then
            echo "Wiki repo cloned successfully."
            cd wiki_repo
            rm -rf *
            cp -r ../wiki/* .
            git add .
            if git diff --staged --quiet; then
              echo "No changes in wiki."
            else
              git commit -m "docs(wiki): sync wiki pages from main repository"
              git push origin master 2>/dev/null || git push origin main
              echo "Wiki successfully synchronized."
            fi
          else
            echo "Notice: Wiki repository not yet initialized on GitHub."
            echo "Please ensure the Wiki feature is enabled in GitHub Repository Settings (Settings > General > Features > Wikis) and create the first page if needed."
          fi
