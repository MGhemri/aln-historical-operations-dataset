name: Release Dev & Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.1.0-dev)'
        required: true
        default: 'v0.1.0-dev'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run dataset validation suite
        run: |
          python validate_dataset.py

      - name: Determine Prerelease Flag
        id: check-prerelease
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          if [[ "$TAG" == *"dev"* ]] || [[ "$TAG" == *"alpha"* ]] || [[ "$TAG" == *"beta"* ]] || [[ "$TAG" == *"rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FLN/ALN Operations Dataset ${{ github.ref_name || inputs.tag_name }}"
          tag_name: "${{ github.ref_name || inputs.tag_name }}"
          prerelease: ${{ steps.check-prerelease.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            operations_fln_1954_1962.json
            operations_fln_1954_1962.geojson
          body: |
            ### 🇩🇿 FLN/ALN Operations Dataset — Release de développement (${{ github.ref_name || inputs.tag_name }})

            Cette version de développement met à disposition la base de données historique consolidée et la plateforme web de consultation cartographique.

            #### 📊 Synthèse des données :
            - **263 opérations militaires documentées et géolocalisées** (1954–1962).
            - **Couverture territoriale complète** : Wilayas I, II, III, IV, V, VI, Zone Autonome d'Alger (ZAA), Zone Autonome d'Oran (ZAO - 18 actions urbaines), Base de l'Est et Fédération de France.
            - **Rigueur méthodologique** : 100% des notices avec sources académiques et archivistiques croisées (ASJP, CRASC, APS, SHD, récits d'acteurs).

            #### 🌐 Accès aux applications déployées :
            - **Production Vercel** : [https://alnop.vercel.app](https://alnop.vercel.app/)
            - **GitHub Pages** : [https://mghemri.github.io/aln-historical-operations-dataset/](https://mghemri.github.io/aln-historical-operations-dataset/)

            #### 📦 Fichiers de données attachés :
            - `operations_fln_1954_1962.json` : Schéma JSON complet structuré.
            - `operations_fln_1954_1962.geojson` : Format standardisé GeoJSON (RFC 7946) prêt pour SIG (QGIS, ArcGIS, Mapbox, Leaflet).
