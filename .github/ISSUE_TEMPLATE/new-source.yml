name: Ajouter une source / إضافة مصدر
description: Proposition soumise à revue humaine / مقترح للمراجعة البشرية
title: '[new-source] '
body:
- type: markdown
  attributes:
    value: 'Contribution publique : pseudonyme et historique visibles. Aucune publication
      automatique. / المساهمة علنية ولا تُنشر تلقائياً.'
- type: input
  id: operation
  attributes:
    label: Identifiant d’une fiche existante / معرّف بطاقة موجودة
    placeholder: OP_1954_001
    description: Copier l’identifiant depuis l’atlas, ne pas en créer. / انسخ المعرّف
      من الأطلس ولا تُنشئ معرّفاً جديداً.
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Description et incertitudes / الوصف وعدم اليقين
    description: Information documentée et passage pertinent / المعلومة الموثقة والموضع
      المعني
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Référence bibliographique obligatoire / المرجع إلزامي
    description: Titre, auteur, date, page ou cote et URL éventuelle. / العنوان والمؤلف
      والتاريخ والصفحة أو رقم الأرشيف والرابط إن وُجد.
  validations:
    required: true
- type: checkboxes
  id: policy
  attributes:
    label: Règles de contribution / قواعد المساهمة
    options:
    - label: Je distingue faits et interprétations, respecte les droits et accepte
        la revue humaine. / أميز الوقائع عن التفسير وأحترم الحقوق وأقبل المراجعة البشرية.
      required: true
