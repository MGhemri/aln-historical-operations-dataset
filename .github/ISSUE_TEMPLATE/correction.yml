name: "Corriger une fiche / تصحيح بطاقة"
description: Proposition soumise à revue humaine / مقترح للمراجعة البشرية
title: "[correction] "
body:
  - type: markdown
    attributes:
      value: "Contribution publique : pseudonyme et historique visibles. Aucune publication automatique. / المساهمة علنية ولا تُنشر تلقائياً."
  - type: input
    id: operation
    attributes:
      label: Identifiant(s) de fiche / معرّفات البطاقات
      placeholder: OP_1954_001
  - type: textarea
    id: description
    attributes:
      label: Description et incertitudes / الوصف وعدم اليقين
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sources ou justification de leur absence / المصادر أو سبب غيابها
      description: Titre, auteur, date, page ou cote et URL. Absence de source = publication bloquée. / العنوان والمؤلف والتاريخ والصفحة والرابط. غياب المصدر يوقف النشر.
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: Règles de contribution / قواعد المساهمة
      options:
        - label: Je distingue faits et interprétations, respecte les droits et accepte la revue humaine. / أميز الوقائع عن التفسير وأحترم الحقوق وأقبل المراجعة البشرية.
          required: true
